name: InfluenceOps CI (Continuous Integration)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # ========================================================
  # 1. 백엔드 무결성 및 구문 검사
  # ========================================================
  backend-test:
    name: Backend Lint & Import Test
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃 소스코드
        uses: actions/checkout@v4

      - name: Python 3.10 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 백엔드 의존성 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 백엔드 모듈 임포트 무결성 검증
        run: |
          cd backend
          python -c "import main, models, schemas; print('✓ Backend core modules imported successfully')"

  # ========================================================
  # 2. 프론트엔드 빌드 무결성 검사 (Vite 8 + React 19)
  # ========================================================
  frontend-build:
    name: Frontend Build & Bundle Test
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃 소스코드
        uses: actions/checkout@v4

      - name: Node.js 20 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트엔드 패키지 설치
        run: |
          cd frontend
          npm ci

      - name: 프론트엔드 프로덕션 번들 빌드
        run: |
          cd frontend
          npm run build
