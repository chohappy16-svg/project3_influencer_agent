services:
  # 1. PostgreSQL 데이터베이스 서비스 (공식 최신 LTS 이미지)
  db:
    image: postgres:15-alpine
    container_name: influenceops-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-influenceops}
    ports:
      # 호스트 로컬 루프백에만 바인딩하여 외부 인터넷(0.0.0.0/0) 직접 노출 원천 차단
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI 백엔드 서비스
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: influenceops-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # 컨테이너 간 통신: localhost 대신 db 서비스 명칭 사용
      POSTGRES_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-influenceops}
      ACTIVE_DB_MODE: postgresql
    ports:
      - "8001:8000"

  # 3. React (Nginx) 프론트엔드 서비스
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: influenceops-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
